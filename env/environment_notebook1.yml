name: spatial-course-2026-nb1

# =====================================================================
# Notebook 1: bin2cell (CRC Visium HD) -> CellTypist -> squidpy
# France 2026 Spatial Transcriptomics summer school.
#
#   micromamba env create -f env/environment_notebook1.yml
#   micromamba run -n spatial-course-2026-nb1 python -m ipykernel install --user \
#       --name spatial-course-2026-nb1 \
#       --display-name "Python (spatial NB1: bin2cell)"
# =====================================================================
#
# NUMPY 1.26.4 (do not unpin):
#   bin2cell normalises the H&E as float16. NumPy 2.0-2.3 has a bug where
#   np.percentile on a large float16 array overflows → all-NaN image →
#   StarDist finds 0 cells. Fixed in 2.4 (Python 3.11+ only). Pin 1.26.4.
#
# SETUPTOOLS <81 (do not unpin):
#   squidpy → spatialdata → xarray_schema imports pkg_resources, removed in 81.
#
# TENSORFLOW 2.15 (do not unpin):
#   StarDist/csbdeep require Keras 2 (tf.keras). TF ≥ 2.16 breaks StarDist.
#   On Apple Silicon tensorflow segfaults; tensorflow-macos is auto-selected.
#
# Heavy packages (tensorflow, stardist, squidpy, celltypist) go through pip
# to keep the conda solve fast.

channels:
  - conda-forge
  # bioconda removed: dry-run on linux-64 confirmed all packages resolve from conda-forge

dependencies:
  - python=3.10
  - pip
  - setuptools<81
  # --- scientific core (conda for fast binary builds) ---
  - numpy=1.26.4
  - pandas
  - scipy
  - scikit-learn
  - scikit-image>=0.22,<0.25
  - matplotlib
  - seaborn
  - h5py
  - pytables
  - opencv
  - tifffile
  - igraph
  - jupyterlab
  - ipykernel
  - ipywidgets
  - pip:
      - scanpy
      - anndata
      - squidpy
      - celltypist
      - bin2cell
      - stardist
      - csbdeep
      - "tensorflow-macos==2.15.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'"
      - "tensorflow==2.15.* ; sys_platform != 'darwin' or platform_machine != 'arm64'"
