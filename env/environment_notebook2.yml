name: spatial-course-2026-nb2

# =====================================================================
# Notebook 2: TissueTag2 region annotation (mouse brain Visium HD)
# France 2026 Spatial Transcriptomics summer school — trimmed env.
# =====================================================================

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - pip
  - setuptools<81
  - git
  # --- scientific core ---
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - scikit-image>=0.22,<0.25   # TissueTag uses skimage.future.trainable_segmentation
  - matplotlib
  - h5py
  - pytables
  - opencv
  - tifffile
  - jupyterlab
  - ipykernel
  - ipywidgets
  # --- TissueTag2 interactive annotator (pinned to help solver) ---
  - bokeh=3.4.*
  - panel=1.4.*
  - jupyter-bokeh
  - holoviews=1.19.*
  - datashader
  - pip:
      - scanpy
      - anndata
      - tinybrain
      - "git+https://github.com/DRPTSB/TissueTag2.git@main"
