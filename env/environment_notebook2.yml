name: spatial-course-2026-nb2

# =====================================================================
# Notebook 2: TissueTag2 region annotation (mouse brain Visium HD)
# France 2026 Spatial Transcriptomics summer school.
#
#   micromamba env create -f env/environment_notebook2.yml
#   micromamba run -n spatial-course-2026-nb2 python -m ipykernel install --user \
#       --name spatial-course-2026-nb2 \
#       --display-name "Python (spatial NB2: TissueTag2)"
# =====================================================================
#
# SCIKIT-IMAGE <0.25 (do not unpin):
#   TissueTag uses skimage.future.trainable_segmentation, removed in 0.25.
#
# SETUPTOOLS <81 (do not unpin):
#   older datashader/holoviews stacks import pkg_resources (removed in 81).
#
# The panel/bokeh/holoviews/datashader stack is installed via pip (not conda)
# to keep the conda solve fast — conda struggles to co-resolve these with the
# scikit-image pin.

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - pip
  - setuptools<81
  - git
  # --- scientific core (conda for the fast binary builds) ---
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - scikit-image>=0.22,<0.25
  - matplotlib
  - h5py
  - pytables
  - opencv
  - tifffile
  - jupyterlab
  - ipykernel
  - ipywidgets
  - pip:
      # single-cell
      - scanpy
      - anndata
      # TissueTag2 interactive stack (all pip — avoids conda solver conflicts)
      - "bokeh>=3.4,<3.5"
      - "panel>=1.4,<1.5"
      - jupyter-bokeh
      - "holoviews>=1.19,<1.20"
      - datashader
      - tinybrain
      # TissueTag2 from main branch
      - "git+https://github.com/DRPTSB/TissueTag2.git@main"
